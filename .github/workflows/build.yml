name: Build

# Click-to-run: load every source that can be loaded, rebuild and test the warehouse, and
# commit the new serving database if every test passed. MoSPI is skipped until its login
# secrets exist. The previous serving file's figures feed the revisions table.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group warehouse

      - name: Load sources
        env:
          MOSPI_EMAIL: ${{ secrets.MOSPI_EMAIL }}
          MOSPI_PASSWORD: ${{ secrets.MOSPI_PASSWORD }}
        run: |
          sources="gst rbi population trai"
          if [ -n "$MOSPI_EMAIL" ]; then sources="$sources mospi-cpi mospi-plfs mospi-asi"; fi
          for source in $sources; do
            echo "::group::$source"
            uv run python -m bharat.ingest "$source"
            echo "::endgroup::"
          done

      - name: Prepare warehouse inputs
        run: uv run python -m bharat.warehouse prepare

      - name: dbt build
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Report dbt results
        if: always()
        run: uv run python -m bharat.warehouse report

      - name: Summary
        run: uv run python -m bharat.warehouse summary

      - name: Commit serving database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898748+github-actions[bot]@users.noreply.github.com"
          git add data/serving/serving.duckdb
          if git diff --cached --quiet; then
            echo "::notice title=serving database::unchanged"
            exit 0
          fi
          git commit -m "data: rebuild serving database (run ${GITHUB_RUN_ID})"
          git pull --rebase origin main
          git push origin HEAD:main
          size=$(du -h data/serving/serving.duckdb | cut -f1)
          echo "::notice title=serving database::committed ($size)"
