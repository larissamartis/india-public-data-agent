name: Screenshots

# Click-to-run: start the app, screenshot every page at 1366 px wide, and commit the images
# to docs/screenshots for review and the README.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --group app
          uv run --group app --with playwright playwright install --with-deps chromium

      - name: Start the app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          nohup uv run --group app streamlit run app/streamlit_app.py --server.port 8501 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done

      - name: Take screenshots
        run: uv run --group app --with playwright python scripts/screenshots.py http://localhost:8501 docs/screenshots

      - name: Report app errors
        if: always()
        run: |
          [ -f app.log ] || exit 0
          if grep -qi "traceback\|error" app.log; then
            detail=$(tail -n 40 app.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=app log::$detail"
          fi

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898748+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: app screenshots (run ${GITHUB_RUN_ID})"
          git pull --rebase origin main
          git push origin HEAD:main
