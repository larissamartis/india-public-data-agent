name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # The whole warehouse, built and tested on a tiny made-up bronze folder.
      - name: Warehouse on fixture data
        env:
          BRONZE_DIR: data/fixture-bronze
          SERVING_DB: data/fixture-serving/serving.duckdb
        run: |
          uv run python -m bharat.warehouse fixtures --bronze "$BRONZE_DIR"
          uv run python -m bharat.warehouse prepare --bronze "$BRONZE_DIR" --database "$SERVING_DB"
          uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Report dbt results
        if: always()
        run: uv run python -m bharat.warehouse report --run-results dbt/target/run_results.json

      # Checks the metric definitions, and that they work against the fixture warehouse.
      - name: Validate MetricFlow definitions
        working-directory: dbt
        env:
          BRONZE_DIR: ${{ github.workspace }}/data/fixture-bronze
          SERVING_DB: ${{ github.workspace }}/data/fixture-serving/serving.duckdb
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: |
          set -o pipefail
          uv run mf validate-configs 2>&1 | tee "$GITHUB_WORKSPACE/mf.log"

      - name: Report MetricFlow errors
        if: failure()
        run: |
          [ -f mf.log ] || exit 0
          detail=$(tail -n 40 mf.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=MetricFlow::$detail"
