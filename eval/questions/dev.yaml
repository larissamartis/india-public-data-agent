# ---------------------------------------------------------------- change over time (13)
- id: D024
  type: change_over_time
  question: By what percentage did Karnataka's total GST collection change between August 2025 and August 2026?
  expected: answer
  kind: number
  unit: per cent
  caveats: [provisional]
  gold_sql: |
    select (b.value - a.value) / a.value * 100 as value
    from fct_state_metric a, fct_state_metric b
    where a.metric_id = 'gst_total' and a.state_name = 'Karnataka' and a.period_label = '2025-08'
      and b.metric_id = 'gst_total' and b.state_name = 'Karnataka' and b.period_label = '2026-08'

- id: D025
  type: change_over_time
  question: What was the compound annual growth rate of Bihar's GSDP at constant prices from 2014-15 to 2023-24?
  expected: answer
  kind: number
  unit: per cent a year
  gold_sql: |
    select (power(b.value / a.value, 1.0 / 9) - 1) * 100 as value
    from fct_state_metric a, fct_state_metric b
    where a.metric_id = 'gsdp_constant' and a.state_name = 'Bihar' and a.period_label = '2014-15'
      and b.metric_id = 'gsdp_constant' and b.state_name = 'Bihar' and b.period_label = '2023-24'

