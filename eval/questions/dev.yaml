# ---------------------------------------------------------------- combining sources (10)
- id: D047
  type: combining_sources
  question: What was Karnataka's total GST collection in 2023-24 as a percentage of its GSDP at current prices?
  expected: answer
  kind: number
  unit: per cent of GSDP
  caveats: [provisional]
  gold_sql: |
    select sum(g.value) / max(y.value) * 100 as value
    from fct_state_metric g, fct_state_metric y
    where g.metric_id = 'gst_total' and g.state_name = 'Karnataka'
      and g.period_start >= date '2023-04-01' and g.period_start < date '2024-04-01'
      and y.metric_id = 'gsdp_current' and y.state_name = 'Karnataka'
      and y.period_label = '2023-24'

- id: D048
  type: combining_sources
  question: Which five states or UTs had the highest GST collection relative to GSDP at current prices in 2023-24?
  expected: answer
  kind: ranking
  unit: per cent of GSDP
  caveats: [provisional]
  gold_sql: |
    with gst as (
      select state_code, state_name, sum(value) as gst from fct_state_metric
      where metric_id = 'gst_total'
        and period_start >= date '2023-04-01' and period_start < date '2024-04-01'
      group by state_code, state_name
    )
    select gst.state_name, gst.gst / y.value * 100 as value
    from gst
    join fct_state_metric y
