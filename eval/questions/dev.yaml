- id: D066
  type: groups
  question: What was the average per capita NSDP at current prices of the five southern states in 2022-23?
  expected: answer
  kind: number
  unit: ₹
  tolerance: 0.03
  caveats: [recompute, projection]
  notes: >-
    Must be population-weighted (equivalent to total NSDP over total population), not a
    simple average of five per-capita figures. Weighted with projected population for 2022;
    RBI's own population base may differ slightly, hence the 3% tolerance.
  gold_sql: |
    select sum(n.value * p.value) / sum(p.value) as value
    from fct_state_metric n
    join fct_state_metric p
      on p.state_code = n.state_code and p.metric_id = 'population' and p.period_label = '2022'
    where n.metric_id = 'per_capita_nsdp_current' and n.period_label = '2022-23'
      and n.state_name in ('Andhra Pradesh', 'Karnataka', 'Kerala', 'Tamil Nadu', 'Telangana')

