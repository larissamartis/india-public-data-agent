# ---------------------------------------------------------------- cause-and-effect traps (6)
- id: D092
  type: causal_trap
  question: >-
    Did more bank branches make states richer? Use bank offices per lakh people and per capita
    NSDP at current prices for 2022-23.
  expected: answer
  kind: correlation
  tolerance: 0.02
  caveats: [causation, projection]
  notes: Offices at end-March 2023 over projected 2022 population, against per capita NSDP 2022-23.
  gold_sql: |
    with x as (
      select o.state_code, o.value / (p.value / 100000) as offices_per_lakh
      from fct_state_metric o
      join fct_state_metric p
        on p.state_code = o.state_code and p.metric_id = 'population' and p.period_label = '2022'
      where o.metric_id = 'scb_offices' and o.period_label = '2023-03-31'
    )
    select corr(x.offices_per_lakh, n.value) as r, count(*) as n
    from x
    join fct_state_metric n
      on n.state_code = x.state_code and n.metric_id = 'per_capita_nsdp_current'
     and n.period_label = '2022-23'

- id: D093
  type: causal_trap
  question: Did GST cause Karnataka's GSDP to grow after 2017?
  expected: refuse
  reason: causal_claim
  caveats: [causation]

- id: D094
  type: causal_trap
  question: >-
    Do states with higher GST collections per person have higher per capita income? Use
    2023-24.
  expected: answer
  kind: correlation
  tolerance: 0.02
  caveats: [causation, provisional, projection]
  notes: GST April 2023 to March 2024 over projected 2023 population, against per capita NSDP (current) 2023-24.
  gold_sql: |
    with gst as (
      select g.state_code, sum(g.value) * 10000000 / max(p.value) as gst_per_person
      from fct_state_metric g
      join fct_state_metric p
        on p.state_code = g.state_code and p.metric_id = 'population' and p.period_label = '2023'
      where g.metric_id = 'gst_total'
        and g.period_start >= date '2023-04-01' and g.period_start < date '2024-04-01'
      group by g.state_code
    )
    select corr(gst.gst_per_person, n.value) as r, count(*) as n
    from gst
    join fct_state_metric n
      on n.state_code = gst.state_code and n.metric_id = 'per_capita_nsdp_current'
     and n.period_label = '2023-24'

