    from fct_state_metric a, fct_state_metric b
    where a.metric_id = 'scb_deposits' and a.state_name = 'Kerala' and a.period_label = '2015-03-31'
      and b.metric_id = 'scb_deposits' and b.state_name = 'Kerala' and b.period_label = '2025-03-31'

