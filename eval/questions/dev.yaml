- id: D033
  type: change_over_time
  question: By what percentage did Uttar Pradesh's total GST collection change from 2023-24 to 2024-25 (financial years)?
  expected: answer
  kind: number
  unit: per cent
  caveats: [provisional]
  gold_sql: |
    with fy as (
      select sum(case when period_start >= date '2023-04-01' and period_start < date '2024-04-01'
                      then value end) as a,
             sum(case when period_start >= date '2024-04-01' and period_start < date '2025-04-01'
                      then value end) as b
      from fct_state_metric
      where metric_id = 'gst_total' and state_name = 'Uttar Pradesh'
    )
    select (b - a) / a * 100 as value from fy

- id: D034
  type: change_over_time
  question: By how many percentage points did Kerala's share of India's bank deposits change between end-March 2015 and end-March 2025?
  expected: answer
  kind: number
  unit: percentage points
  gold_sql: |
    with share as (
      select s.period_label, s.value / n.value * 100 as pct
      from fct_state_metric s
      join fct_national_metric n on n.metric_id = s.metric_id and n.period_label = s.period_label
      where s.metric_id = 'scb_deposits' and s.state_name = 'Kerala'
        and s.period_label in ('2015-03-31', '2025-03-31')
    )
    select max(case when period_label = '2025-03-31' then pct end)
         - max(case when period_label = '2015-03-31' then pct end) as value
    from share

