# Development questions: used for tuning and as worked examples. Gold answers come from
# gold_sql run against the pinned serving file (see eval/REVIEW.md once generated).
# Conventions: number -> one value; ranking -> rows of (name, value) in order;
# series -> rows of (period_label, value) in time order; correlation -> one row (r, n).
# Money in ₹ crore unless the unit says otherwise. FY = April to March.

questions:

