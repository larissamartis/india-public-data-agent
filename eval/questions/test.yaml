# ---------------------------------------------------------------- change over time (7)
- id: T013
  type: change_over_time
  question: By what percentage did Rajasthan's total GST collection change between July 2025 and July 2026?
  expected: answer
  kind: number
  unit: per cent
  caveats: [provisional]
  gold_sql: |
    select (b.value - a.value) / a.value * 100 as value
    from fct_state_metric a, fct_state_metric b
    where a.metric_id = 'gst_total' and a.state_name = 'Rajasthan' and a.period_label = '2025-07'
      and b.metric_id = 'gst_total' and b.state_name = 'Rajasthan' and b.period_label = '2026-07'

- id: T014
  type: change_over_time
  question: What was the compound annual growth rate of Odisha's GSDP at constant prices from 2015-16 to 2022-23?
  expected: answer
  kind: number
  unit: per cent a year
  gold_sql: |
    select (power(b.value / a.value, 1.0 / 7) - 1) * 100 as value
    from fct_state_metric a, fct_state_metric b
    where a.metric_id = 'gsdp_constant' and a.state_name = 'Odisha' and a.period_label = '2015-16'
      and b.metric_id = 'gsdp_constant' and b.state_name = 'Odisha' and b.period_label = '2022-23'

- id: T015
  type: change_over_time
  question: How much did bank credit in Gujarat grow, in ₹ crore, between end-March 2016 and end-March 2025?
  expected: answer
  kind: number
  unit: ₹ crore
  gold_sql: |
    select b.value - a.value as value
    from fct_state_metric a, fct_state_metric b
    where a.metric_id = 'scb_credit' and a.state_name = 'Gujarat' and a.period_label = '2016-03-31'
      and b.metric_id = 'scb_credit' and b.state_name = 'Gujarat' and b.period_label = '2025-03-31'

- id: T016
  type: change_over_time
  question: By what percentage is Uttar Pradesh's population projected to grow between 2021 and 2031?
  expected: answer
  kind: number
  unit: per cent
  caveats: [projection]
  gold_sql: |
    select (b.value - a.value) / a.value * 100 as value
    from fct_state_metric a, fct_state_metric b
    where a.metric_id = 'population' and a.state_name = 'Uttar Pradesh' and a.period_label = '2021'
      and b.metric_id = 'population' and b.state_name = 'Uttar Pradesh' and b.period_label = '2031'

- id: T017
  type: change_over_time
  question: What was the year-on-year growth in West Bengal's GSDP at current prices in 2022-23?
  expected: answer
  kind: number
  unit: per cent
  gold_sql: |
    select (b.value - a.value) / a.value * 100 as value
