# Held-out test questions. Never used as worked examples or for tuning; run only at
# milestones, and the report states how many test runs there were.
# Same conventions as dev.yaml.

questions:

# ---------------------------------------------------------------- single facts (7)
- id: T001
  type: single_fact
  question: What was Gujarat's total GST collection in July 2026?
  expected: answer
  kind: number
  unit: ₹ crore
  caveats: [provisional]
  gold_sql: |
    select value from fct_state_metric
    where metric_id = 'gst_total' and state_name = 'Gujarat' and period_label = '2026-07'

- id: T002
  type: single_fact
  question: What was West Bengal's GSDP at constant 2011-12 prices in 2022-23?
  expected: answer
  kind: number
  unit: ₹ crore
  gold_sql: |
    select value from fct_state_metric
    where metric_id = 'gsdp_constant' and state_name = 'West Bengal' and period_label = '2022-23'

- id: T003
  type: single_fact
  question: What was Haryana's per capita NSDP at constant prices in 2022-23?
  expected: answer
  kind: number
  unit: ₹
  gold_sql: |
    select value from fct_state_metric
    where metric_id = 'per_capita_nsdp_constant' and state_name = 'Haryana'
      and period_label = '2022-23'

- id: T004
