    select sum(value) as value from fct_state_metric
    where metric_id = 'gst_total'
      and period_start >= date '2025-04-01' and period_start < date '2026-04-01'
      and state_name in ('Arunachal Pradesh', 'Assam', 'Manipur', 'Meghalaya', 'Mizoram',
