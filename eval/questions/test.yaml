# ---------------------------------------------------------------- cause-and-effect traps (4)
- id: T050
  type: causal_trap
  question: Did the COVID-19 lockdown cause the fall in Maharashtra's GSDP in 2020-21?
  expected: refuse
  reason: causal_claim
  caveats: [causation]

- id: T051
  type: causal_trap
  question: >-
    Do states with higher credit-deposit ratios have higher per capita NSDP at current prices?
    Use end-March 2023 and 2022-23.
  expected: answer
  kind: correlation
  tolerance: 0.02
  caveats: [causation]
  gold_sql: |
    with cd as (
      select c.state_code, c.value / d.value * 100 as cd_ratio
      from fct_state_metric c
      join fct_state_metric d
        on d.state_code = c.state_code and d.period_label = c.period_label
       and d.metric_id = 'scb_deposits'
      where c.metric_id = 'scb_credit' and c.period_label = '2023-03-31'
    )
    select corr(cd.cd_ratio, n.value) as r, count(*) as n
    from cd
    join fct_state_metric n
      on n.state_code = cd.state_code and n.metric_id = 'per_capita_nsdp_current'
     and n.period_label = '2022-23'

- id: T052
  type: causal_trap
  question: Did more bank offices cause Kerala's deposits to rise between 2015 and 2025?
  expected: refuse
  reason: causal_claim
  caveats: [causation]

- id: T053
  type: causal_trap
  question: Do richer states collect more GST because they are richer? Compare GSDP and GST for 2023-24.
  expected: answer
  kind: correlation
  tolerance: 0.02
  caveats: [causation, provisional]
  gold_sql: |
    with gst as (
      select state_code, sum(value) as gst from fct_state_metric
      where metric_id = 'gst_total'
        and period_start >= date '2023-04-01' and period_start < date '2024-04-01'
      group by state_code
    )
    select corr(gst.gst, y.value) as r, count(*) as n
    from gst
    join fct_state_metric y
      on y.state_code = gst.state_code and y.metric_id = 'gsdp_current'
