    from fct_state_metric g, fct_state_metric y
    where g.metric_id = 'gst_total' and g.state_name = 'Maharashtra'
      and g.period_start >= date '2023-04-01' and g.period_start < date '2024-04-01'
      and y.metric_id = 'gsdp_current' and y.state_name = 'Maharashtra'
      and y.period_label = '2023-24'

- id: T026
  type: combining_sources
  question: What was bank credit as a percentage of GSDP at current prices in Kerala, using credit at end-March 2024 and GSDP for 2023-24?
  expected: answer
  kind: number
  unit: per cent of GSDP
  gold_sql: |
    select c.value / y.value * 100 as value
    from fct_state_metric c, fct_state_metric y
    where c.metric_id = 'scb_credit' and c.state_name = 'Kerala' and c.period_label = '2024-03-31'
      and y.metric_id = 'gsdp_current' and y.state_name = 'Kerala' and y.period_label = '2023-24'

- id: T027
  type: combining_sources
  question: What was GSDP per person at current prices in Bihar in 2023-24, using the projected population for 2023?
  expected: answer
  kind: number
  unit: ₹ per person
  caveats: [projection]
  gold_sql: |
    select y.value * 10000000 / p.value as value
    from fct_state_metric y, fct_state_metric p
    where y.metric_id = 'gsdp_current' and y.state_name = 'Bihar' and y.period_label = '2023-24'
      and p.metric_id = 'population' and p.state_name = 'Bihar' and p.period_label = '2023'

- id: T028
  type: combining_sources
  question: How many wireless subscribers per 100 people were there in the Gujarat service area at the end of September 2026, using Gujarat's projected 2026 population?
  expected: answer
  kind: number
  unit: subscribers per 100 people
  caveats: [service_area, projection]
  gold_sql: |
    select w.value / p.value * 100 as value
    from fct_lsa_metric w, fct_state_metric p
    where w.service_area = 'Gujarat' and w.period_label = '2026-09'
      and p.metric_id = 'population' and p.state_name = 'Gujarat' and p.period_label = '2026'

- id: T029
  type: combining_sources
  question: Which collected more GST per person in 2025-26, Gujarat or Tamil Nadu?
  expected: answer
  kind: ranking
  unit: ₹ per person
  caveats: [provisional, projection]
  gold_sql: |
    with gst as (
      select state_code, state_name, sum(value) as gst from fct_state_metric
      where metric_id = 'gst_total'
        and period_start >= date '2025-04-01' and period_start < date '2026-04-01'
        and state_name in ('Gujarat', 'Tamil Nadu')
      group by state_code, state_name
    )
    select gst.state_name, gst.gst * 10000000 / p.value as value
    from gst
    join fct_state_metric p
      on p.state_code = gst.state_code and p.metric_id = 'population' and p.period_label = '2025'
    order by value desc

# ---------------------------------------------------------------- trends (4)
- id: T030
  type: trend
  question: Show Tamil Nadu's total GST collection for each financial year from 2018-19 to 2025-26.
  expected: answer
  kind: series
  unit: ₹ crore
  caveats: [provisional]
  gold_sql: |
    with m as (
      select case when month(period_start) >= 4 then year(period_start)
                  else year(period_start) - 1 end as fy_start, value
      from fct_state_metric
      where metric_id = 'gst_total' and state_name = 'Tamil Nadu'
    )
    select printf('%d-%02d', fy_start, (fy_start + 1) % 100) as period_label, sum(value) as value
    from m where fy_start between 2018 and 2025
    group by fy_start order by fy_start

- id: T031
  type: trend
  question: Show Gujarat's GSDP at constant prices for each year from 2011-12 to 2022-23.
  expected: answer
