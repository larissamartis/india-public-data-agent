    where a.metric_id = 'gsdp_current' and a.state_name = 'West Bengal'
      and a.period_label = '2021-22'
      and b.metric_id = 'gsdp_current' and b.state_name = 'West Bengal'
      and b.period_label = '2022-23'

- id: T018
  type: change_over_time
  question: By how many did bank offices in Bihar increase between end-March 2010 and end-March 2025?
  expected: answer
  kind: number
  unit: offices
  gold_sql: |
    select b.value - a.value as value
    from fct_state_metric a, fct_state_metric b
    where a.metric_id = 'scb_offices' and a.state_name = 'Bihar' and a.period_label = '2010-03-31'
      and b.metric_id = 'scb_offices' and b.state_name = 'Bihar' and b.period_label = '2025-03-31'

- id: T019
  type: change_over_time
  question: How many wireless subscribers did the Bihar service area gain or lose between August and September 2026?
  expected: answer
  kind: number
