  caveats: [service_area]
  notes: TRAI's Bihar service area includes Jharkhand.
  gold_sql: |
    select b.value - a.value as value
    from fct_lsa_metric a, fct_lsa_metric b
    where a.service_area = 'Bihar' and a.period_label = '2026-08'
      and b.service_area = 'Bihar' and b.period_label = '2026-09'

# ---------------------------------------------------------------- scaled comparisons (5)
- id: T020
  type: scaled_comparison
  question: What was the credit-deposit ratio of scheduled commercial banks in Kerala at end-March 2025?
  expected: answer
  kind: number
  unit: per cent
  gold_sql: |
    select c.value / d.value * 100 as value
    from fct_state_metric c, fct_state_metric d
    where c.metric_id = 'scb_credit' and c.state_name = 'Kerala' and c.period_label = '2025-03-31'
      and d.metric_id = 'scb_deposits' and d.state_name = 'Kerala' and d.period_label = '2025-03-31'

- id: T021
  type: scaled_comparison
  question: What share of India's bank credit went to Karnataka at end-March 2025?
  expected: answer
  kind: number
  unit: per cent
  gold_sql: |
    select s.value / n.value * 100 as value
    from fct_state_metric s, fct_national_metric n
    where s.metric_id = 'scb_credit' and s.state_name = 'Karnataka'
      and s.period_label = '2025-03-31'
      and n.metric_id = 'scb_credit' and n.period_label = '2025-03-31'

- id: T022
  type: scaled_comparison
  question: How many bank offices were there per lakh people in Kerala in 2025?
  expected: answer
  kind: number
  unit: offices per lakh people
  caveats: [projection]
  gold_sql: |
    select o.value / (p.value / 100000) as value
    from fct_state_metric o, fct_state_metric p
    where o.metric_id = 'scb_offices' and o.state_name = 'Kerala' and o.period_label = '2025-03-31'
      and p.metric_id = 'population' and p.state_name = 'Kerala' and p.period_label = '2025'

- id: T023
  type: scaled_comparison
  question: How much GST was collected per person in Maharashtra in 2024-25?
  expected: answer
  kind: number
  unit: ₹ per person
  caveats: [provisional, projection]
  gold_sql: |
    select sum(g.value) * 10000000 / max(p.value) as value
    from fct_state_metric g, fct_state_metric p
    where g.metric_id = 'gst_total' and g.state_name = 'Maharashtra'
      and g.period_start >= date '2024-04-01' and g.period_start < date '2025-04-01'
      and p.metric_id = 'population' and p.state_name = 'Maharashtra' and p.period_label = '2024'

- id: T024
  type: scaled_comparison
  question: Which three states or UTs have the highest projected sex ratio (females per 1,000 males) in 2030?
  expected: answer
  kind: ranking
  unit: females per 1,000 males
  caveats: [projection]
  notes: >-
    Checked against PDF page 90: Odisha 20,989 thousand males, 23,975 thousand females.
    Far from Census 2011 (979) but it is what the report prints.
  gold_sql: |
    select f.state_name, f.value / m.value * 1000 as value
    from fct_state_metric f
    join fct_state_metric m
      on m.state_code = f.state_code and m.period_label = f.period_label
     and m.metric_id = 'population_male'
    where f.metric_id = 'population_female' and f.period_label = '2030'
    order by value desc limit 3

# ---------------------------------------------------------------- combining sources (5)
- id: T025
  type: combining_sources
  question: What was Maharashtra's total GST collection in 2023-24 as a percentage of its GSDP at current prices?
  expected: answer
  kind: number
  unit: per cent of GSDP
  caveats: [provisional]
