[project]
name = "india-public-data-agent"
version = "0.1.0"
description = "An AI analyst for India's public state-level data, with traceable, verified answers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "sqlglot>=26.0",
    "xlrd>=2.0",
]

[dependency-groups]
warehouse = [
    "dbt-duckdb>=1.9",
]
dev = [
    "pytest>=8.3",
    "pytest-github-actions-annotate-failures>=0.2",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bharat"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
